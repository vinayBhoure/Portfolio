const DEVICON = (slug) =>
  `https://cdn.jsdelivr.net/gh/devicons/devicon/icons/${slug}.svg`;

function Icon({ name, size = 16, className = "", style = {} }) {
  return (
    <i
      data-lucide={name}
      className={"pf-icon " + className}
      style={{ width: size, height: size, display: "inline-flex", ...style }}
    />
  );
}

function Container({ children, className = "", style = {}, wide = false, id }) {
  return (
    <div
      id={id}
      className={"pf-container pf-fade " + className}
      style={{ maxWidth: wide ? 1024 : 768, ...style }}
    >
      {children}
    </div>
  );
}

function Button({ children, variant = "default", onClick, as = "button", href, download }) {
  const cls = `pf-btn pf-btn-${variant}`;
  if (as === "a")
    return (
      <a className={cls} href={href} onClick={onClick} download={download} target={download ? undefined : "_blank"} rel="noreferrer">
        {children}
      </a>
    );
  return (
    <button className={cls} onClick={onClick}>
      {children}
    </button>
  );
}

function SkillChip({ name }) {
  const slug = (window.PORTFOLIO_DATA.techIcons[name] ?? "");
  return (
    <span className="pf-skill">
      {slug ? <img src={DEVICON(slug)} alt="" /> : <span className="pf-skill-dot" />}
      <span>{name}</span>
    </span>
  );
}

function HeroSkill({ name, icon }) {
  return (
    <span className="pf-skill">
      {icon ? <img src={DEVICON(icon)} alt="" /> : null}
      <span>{name}</span>

function TechChip({ name }) {
  const slug = (window.PORTFOLIO_DATA.techIcons[name] ?? "");
  return (
    <span className="pf-tech">

function WorkingPill({ label = "Working" }) {
  return (
    <span className="pf-working">
      <span className="pf-working-dot" />

    </span>

}

function SectionHeading({ eyebrow, heading }) {
  return (
    <div className="pf-heading">
      <p className="pf-eyebrow">{eyebrow}</p>
      <h2 className="pf-h2">{heading}</h2>
    </div>

// Monogram avatar tile — replaces the source pixel-art logo (honest, on-brand blue/yellow tile).
function Monogram({ size = 48, className = "" }) {
  const D = window.PORTFOLIO_DATA;
  return (
    <span className={"pf-monogram " + className} style={{ width: size, height: size, fontSize: size * 0.4 }}>
      {D.person.monogram}
    </span>

}

function renderEmphasis(text) {
  const parts = text.split(/(\*[^*]+\*)/g);
  return parts.map((p, i) =>
    p.startsWith("*") && p.endsWith("*") ? (
      <b key={i}>{p.slice(1, -1)}</b>
    ) : (
      <span key={i}>{p}</span>
    )
  );
}

Object.assign(window, {
  DEVICON, Icon, Container, Button, SkillChip, HeroSkill, TechChip,
  WorkingPill, SectionHeading, Monogram, renderEmphasis,

<script type="text/babel">
// Hero — availability badge, headline, skill-laced lead, dual CTA, proof strip, socials.
function Hero() {
  const D = window.PORTFOLIO_DATA;

  const renderLead = () => {
    const nodes = [];
    const tokens = D.heroTemplate.split(/(\{\d+\}|\*[^*]+\*)/g);
    tokens.forEach((tok, i) => {
      const m = tok.match(/^\{(\d+)\}$/);
      if (m) {
        const s = D.heroSkills[Number(m[1])];
        nodes.push(<HeroSkill key={i} name={s.name} icon={s.icon} />);
      } else if (tok.startsWith("*") && tok.endsWith("*")) {
        nodes.push(<b key={i} className="pf-hero-bold">{tok.slice(1, -1)}</b>);
      } else if (tok) {
        nodes.push(<span key={i}>{tok}</span>);
      }
    });
    return nodes;
  };

  return (
    <Container wide id="top">
      {D.availability.open && (
        <span className="pf-avail">
          <span className="pf-avail-dot" />
          {D.availability.label}
        </span>

      <div className="pf-hero-head">
        <Monogram size={88} className="pf-hero-monogram" />
        <div className="pf-hero-name">

          </h1>
        </div>

      <h2 className="pf-hero-headline">{D.heroHeadline}</h2>
      <div className="pf-hero-desc">{renderLead()}</div>
      <div className="pf-hero-buttons">
        <Button variant="default" onClick={() => window.pfOpenBooking?.()}>
          <Icon name="calendar" /> Book a call
        </Button>
        <Button variant="outline" as="a" href={D.person.resumeUrl} download>
          <Icon name="file-text" /> Download résumé
        </Button>
        <div className="pf-hero-socials">
          {D.socials.map((s) => (
            <a key={s.name} href={s.href} title={s.name} className="pf-social" target="_blank" rel="noreferrer">
              <Icon name={s.icon} size={20} />
            </a>
          ))}
        </div>
      </div>
      <div className="pf-metrics">
        {D.metrics.map((m, i) => (

            <div className="pf-metric-label">{m.label}</div>

        ))}

  );
}

</script>

<script type="text/babel">
// GitHub activity graph — recreates react-activity-calendar with seeded data.
function GithubGraph() {
  const D = window.PORTFOLIO_DATA;
  const WEEKS = 52, DAYS = 7;
  const cells = React.useMemo(() => {
    let seed = 11;
    const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const out = [];
    for (let w = 0; w < WEEKS; w++) {
      const col = [];
      for (let d = 0; d < DAYS; d++) {
        const r = rand();
        let level = 0;
        if (r > 0.5) level = 1;
        if (r > 0.7) level = 2;
        if (r > 0.85) level = 3;
        if (r > 0.94) level = 4;
        col.push(level);
      }
      out.push(col);
    }
    return out;
  }, []);
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  return (
    <Container className="pf-section">
      <div className="pf-gh-head">
        <h2 className="pf-h2">Always building</h2>
        <p className="pf-meta-text"><b>{D.github.username}</b> · contribution activity over the past year</p>
        <p className="pf-gh-total">Total: <span style={{ fontWeight: 900 }}>{D.github.total.toLocaleString()}</span> contributions</p>
      </div>
      <div className="pf-gh-frame">
        <div className="pf-gh-scroll">
          <div className="pf-gh-months">{months.map((m) => <span key={m}>{m}</span>)}</div>
          <div className="pf-gh-grid">
            {cells.map((col, w) => (
              <div key={w} className="pf-gh-col">
                {col.map((lvl, d) => (
                  <div key={d} className="pf-gh-cell" style={{ background: `var(--gh-l${lvl})` }} />
                ))}
              </div>
            ))}
          </div>
          <div className="pf-gh-legend">
            <span>Less</span>
            {[0,1,2,3,4].map((l) => <div key={l} className="pf-gh-cell" style={{ background: `var(--gh-l${l})` }} />)}
            <span>More</span>
          </div>
        </div>
      </div>
    </Container>
  );
}

window.GithubGraph = GithubGraph;

</script>
